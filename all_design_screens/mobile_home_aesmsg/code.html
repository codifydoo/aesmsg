</button>

</button>

<div class="w-10 h-10 rounded-lg bg-background flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="vpn_key">vpn_key</span>
</div>

<span class="block text-on-surface-variant text-[12px] font-mono-code opacity-60">e82f...a9c2</span>

</div>
