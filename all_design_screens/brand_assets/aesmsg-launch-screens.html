<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aesmsg — Launch Screens</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;}
  .frame{border:0;display:block;border-radius:38px;background:#141218;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
  const { useState } = React;

  function Phone({ w, h }){
    return (
      <iframe className="frame" src="aesmsg-splash.html" width={w} height={h}
        title="aesmsg splash" scrolling="no"></iframe>
    );
  }

  function App(){
    return (
      <DesignCanvas>
        <DCSection id="launch" title="aesmsg — Launch Screen" subtitle="Zero-knowledge encryption · Midnight base, electric-violet keyhole mark">
          <DCArtboard id="ios" label="iOS · 1284 × 2778" width={342} height={740}>
            <Phone w={342} h={740} />
          </DCArtboard>
          <DCArtboard id="android" label="Android · 1080 × 2400" width={342} height={760}>
            <Phone w={342} h={760} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
