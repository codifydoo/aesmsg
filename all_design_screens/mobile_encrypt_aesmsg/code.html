<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;

            white-space: nowrap;
            direction: ltr;
        }

            color: #948e9c;
            opacity: 0.5;
        }
        .glass-panel {
            background: rgba(20, 18, 24, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

            background: linear-gradient(135deg, #cfbcff 0%, #cdc0e9 100%);
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar Navigation Shell (Destination: Create/Task Focused) -->
<header class="fixed top-0 z-50 w-full bg-surface/80 backdrop-blur-xl border-b border-outline-variant/10">
<div class="flex justify-between items-center w-full px-lg py-md max-w-7xl mx-auto">
<button class="text-on-surface p-xs active:scale-95 transition-transform">
<span class="material-symbols-outlined">close</span>
</button>
<h2 class="font-display text-h2 font-bold tracking-tight text-on-surface">New Message</h2>
<div class="flex gap-md items-center">
<span class="material-symbols-outlined text-tertiary">verified_user</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[80px] pb-[120px] px-lg flex flex-col gap-lg max-w-2xl mx-auto w-full">
<!-- Status Chip: Institutional Trust Indicator -->
<div class="flex justify-center">
<div class="inline-flex items-center gap-sm px-md py-xs bg-surface-container-low border border-emerald-500/30 rounded-full">
<span class="material-symbols-outlined text-[14px] text-emerald-500" data-weight="fill">lock</span>
<span class="font-label-sm text-label-sm text-emerald-500 uppercase tracking-widest">End-to-End Encryption Active</span>
</div>
</div>
<!-- Recipient Selector Section -->
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase px-xs">To</label>
<div class="bg-surface-container-low border border-outline-variant/10 rounded-xl p-md flex items-center gap-md">
<div class="w-8 h-8 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[20px]">person_add</span>
</div>
<input class="bg-transparent border-none focus:ring-0 text-body-md w-full placeholder:text-on-surface-variant/50" placeholder="Search contacts or enter public key..." type="text"/>
</div>
</div>
<!-- Message Body: Full-Screen Composer Feel -->
<div class="flex-grow flex flex-col space-y-sm min-h-[300px]">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase px-xs">Message</label>
<div class="flex-grow bg-surface-container-low border border-outline-variant/10 rounded-xl p-lg flex flex-col focus-within:border-primary/40 transition-colors">
<textarea class="message-compose-area flex-grow bg-transparent border-none focus:ring-0 text-body-lg font-mono-code resize-none p-0 w-full" placeholder="Type your secure message here... All content is encrypted locally before transmission."></textarea>
<!-- Add File Trigger -->
<div class="mt-lg pt-md border-t border-outline-variant/10 flex items-center justify-between">
<button class="flex items-center gap-sm text-primary hover:text-primary-fixed transition-colors active:scale-95">
<span class="material-symbols-outlined">attach_file</span>
<span class="font-label-sm">Add encrypted file</span>
</button>
<span class="font-label-sm text-on-surface-variant/40">0 chars</span>
</div>
</div>
</div>
<!-- Meta Controls (Simulated Bottom Sheet Triggers) -->
<div class="grid grid-cols-2 gap-md">
<div class="bg-surface-container-low border border-outline-variant/10 rounded-xl p-md flex items-center justify-between active:bg-surface-container-high transition-colors cursor-pointer">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant">timer</span>
<div class="flex flex-col">
<span class="font-label-sm text-[11px] text-on-surface-variant/60 uppercase">Expiry</span>
<span class="text-body-md font-medium">24 Hours</span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant/40">expand_less</span>
</div>
<div class="bg-surface-container-low border border-outline-variant/10 rounded-xl p-md flex items-center justify-between active:bg-surface-container-high transition-colors cursor-pointer">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant">visibility</span>
<div class="flex flex-col">
<span class="font-label-sm text-[11px] text-on-surface-variant/60 uppercase">Max Opens</span>
<span class="text-body-md font-medium">Once</span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant/40">expand_less</span>
</div>
</div>
</main>
<!-- Fixed Action Footer: The Seal of Privacy -->
<footer class="fixed bottom-0 w-full glass-panel border-t border-outline-variant/10 px-lg pt-md pb-xxl z-50">
<div class="max-w-2xl mx-auto">
<button class="w-full encryption-gradient py-lg rounded-xl flex items-center justify-center gap-md group active:scale-[0.98] transition-all shadow-[0_0_20px_rgba(207,188,255,0.15)]">
<span class="material-symbols-outlined text-on-primary font-bold">lock_open</span>
<span class="text-on-primary font-h2 text-h2 font-bold tracking-tight">Encrypt &amp; Send</span>
<span class="material-symbols-outlined text-on-primary group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<p class="text-center text-[11px] text-on-surface-variant/40 mt-md font-label-sm uppercase tracking-tighter">
                AES-256-GCM local encryption • No plain-text ever hits our servers
            </p>
</div>
</footer>
<!-- Visual Polish: Background Texture -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-tertiary/5 blur-[120px] rounded-full"></div>
</div>
