# aesmsg web client — static serving config (see docs/deploy.md, "apps/webapp").
# The per-page <meta> CSP baked by scripts/inject-csp.mjs is authoritative for the
# resource directives; this server adds only frame-ancestors + classic hardening.
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/wasm;

  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  # Sproobo's deploy health gate probes :3000/healthz.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Reader shell: serve the same static l.html for /l and for /l/<16-char base64url id>
  # WITHOUT a redirect and WITHOUT changing the URL — the client reads the id from
  # location.pathname. The 16-char class mirrors the app's LINK_ID_REGEX; junk paths
  # 404 at the edge and the client re-validates the id regardless.
  location = /l {
    try_files /l.html =404;
  }
  location ~ "^/l/[A-Za-z0-9_-]{16}/?$" {
    try_files /l.html =404;
  }

  # Hash-named build assets are safe to cache forever. add_header does not inherit
  # once a location declares its own, so the security headers are re-stated here.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  # Next static export emits <route>.html files: /contacts -> contacts.html, etc.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
